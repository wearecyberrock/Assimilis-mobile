name: Build Assimilis Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install a modern glslc for llama.cpp Vulkan shaders
        # The NDK's glslc is too old for ggml-vulkan's cooperative-matrix
        # shaders; the llama plugin's CMake looks for glslc in /usr/local/bin.
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
          sudo ln -sf "$(command -v glslc)" /usr/local/bin/glslc
          glslc --version
      - run: flutter pub get
      - name: Build release APK (arm64, debug-signed for personal install)
        env:
          ASSIMILIS_ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: assimilis-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
