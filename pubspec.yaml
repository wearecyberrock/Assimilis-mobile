name: assimilis_mobile
description: Assimilis Mobile. On-device and cloud AI, an agent workstation and Android phone control in one app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

# Merged from three apps (see NOTICE.md):
#   PrivateLM (cross-platform-llm-client)  -> lib/ (base: chat, local GGUF, Stable Diffusion, LiteRT, cloud)
#   PocketStrike                           -> lib/workstation/ (ReAct agent, MCP, Hermes memory, files)
#   PrivateAgent (private-agent)           -> lib/phone_agent/ (Accessibility phone control, voice)
dependencies:
  flutter:
    sdk: flutter

  # --- shared ---
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  dio: ^5.11.0
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^18.0.1
  flutter_background_service: ^5.1.0
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.0
  google_fonts: ^8.2.1
  uuid: ^4.6.0
  intl: ^0.20.3
  image: ^4.9.2
  file_picker: ^12.0.0
  share_plus: ^13.2.0
  url_launcher: ^6.3.2
  speech_to_text: ^7.0.0

  # --- PrivateLM (base) ---
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  llama_flutter_android: ^0.2.6
  sd_flutter_android:
    path: local_plugins/sd_flutter_android
  flutter_litert_lm:
    path: local_plugins/flutter_litert_lm
  ffi: ^2.1.2
  web: ^1.1.1
  image_picker: ^1.1.0
  flutter_inappwebview: ^6.1.5
  gal: ^2.3.2
  syncfusion_flutter_pdf: ^33.2.6
  package_info_plus: ">=9.0.1 <13.0.0"
  device_info_plus: ">=12.4.0 <15.0.0"
  archive: ^4.0.9
  xml: ^6.6.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  # Firebase is optional: android/app only applies it when google-services.json exists.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.3.10

  # --- PocketStrike (workstation) ---
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.0.0
  mcp_dart: ^2.4.1
  flutter_highlight: ^0.7.0
  flutter_animate: ^4.5.2
  collection: ^1.19.1

  # --- PrivateAgent (phone control) ---
  flutter_tts: ^4.2.0
  installed_apps: ^1.5.0
  android_intent_plus: ^5.1.0
  flutter_contacts: ^1.1.9+2
  volume_controller: ^2.0.8
  screen_brightness: ^1.0.1
  shizuku_api: ^1.2.2
  flutter_overlay_window: ^0.5.0
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  timezone: ^0.10.1
  flutter_math_fork: ^0.7.4
  math_expressions: ^3.2.0
  flutter_timezone: ^5.1.1

dependency_overrides:
  llama_flutter_android:
    path: local_plugins/llama_flutter_android
  flutter_overlay_window:
    path: local_plugins/flutter_overlay_window

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/webgpu_engine.html
    - assets/icons/
    - assets/brand/
    - assets/workstation/icons/
    - assets/phone_agent/
    - assets/hes/
    - assets/hes/modules/
